<!DOCTYPE html>
<meta charset="utf-8">
<title>PSD Editor</title>
<style>
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #start{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;gap:40px;
  }
  #pick{
    font-size:28px;font-weight:600;padding:22px 46px;
    background:#1a1a1a;color:#D4A017;border:1.5px solid #D4A017;border-radius:18px;
    cursor:pointer;letter-spacing:.2px;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
    transition:background .15s ease;
  }
  #pick:hover{background:#262626}
  #psd{display:none}

  #secondary{display:flex;flex-direction:column;align-items:center;gap:16px;width:340px}

  #fontrow{display:flex;align-items:center;gap:10px;font-size:14px;color:#8a8a8e}
  #font{
    font-size:14px;color:#6e6e73;background:transparent;
    border:none;border-bottom:1px solid #d2d2d7;
    padding:2px 4px;cursor:pointer;outline:none;
  }
  #font:hover,#font:focus{color:#1d1d1f;border-bottom-color:#1d1d1f}

  #textblock{width:100%;display:flex;flex-direction:column;gap:6px}
  #textblock label{font-size:13px;color:#8a8a8e;text-align:center}
  #cardtext{
    width:100%;box-sizing:border-box;
    font-size:14px;color:#1d1d1f;font-family:inherit;
    border:1px solid #d2d2d7;border-radius:10px;
    padding:10px 12px;resize:vertical;min-height:80px;
    outline:none;text-align:center;
  }
  #cardtext:focus{border-color:#1d1d1f}

  #bar{display:flex;align-items:center;gap:6px;font-size:13px;color:#8a8a8e}
  #bar input[type=checkbox]{width:14px;height:14px;accent-color:#1d1d1f;cursor:pointer}
  #status{margin-left:8px;color:#8a8a8e;font-size:13px}

  #pea{width:100vw;height:100vh;display:none}
</style>

<div id="start">
  <label id="pick" for="psd">📂 Выбрать PSD-шаблон</label>
  <input type="file" id="psd" accept=".psd">
  <div id="secondary">
    <div id="fontrow">
      <span>Шрифт</span>
      <select id="font"><option>загружаю список...</option></select>
    </div>
    <div id="textblock">
      <label for="cardtext">Текст на карточке</label>
      <textarea id="cardtext" rows="4"></textarea>
    </div>
    <div id="bar">
      <label style="display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="autoclose"> закрывать вкладку после сохранения
      </label>
      <span id="status"></span>
    </div>
  </div>
</div>
<div id="pea"></div>

<script src="https://cdn.jsdelivr.net/npm/photopea@1.0.2/dist/photopea.min.js"></script>
<script>
const FONTS_API = "https://api.github.com/repos/pablitocrypto/photopi/contents/fonts";
const PSD_URL   = "";

/* МЯГКОСТЬ КРАЁВ БУКВ. 0 = выключено (как раньше).
   0.5 = чуть-чуть, 0.7 = заметно, 1.0 = сильно. */
const SOFT = 0.5;

/* ТЕКСТ ПО ЦЕНТРУ ЛИСТКА ПО ВЫСОТЕ. true = включено, false = выключено */
const CENTER_V = true;

/* НАСКОЛЬКО ПОДНЯТЬ КОРОТКИЙ ТЕКСТ К ВЕРХУ ЛИСТКА.
   0 = ровно по центру, 0.5 = на полпути к верху, 1 = прижать к верху (как в шаблоне).
   Длинный текст (как в шаблоне и длиннее) всегда стоит по центру. */
const UP = 0.7;

/* СЛУЧАЙНЫЙ СДВИГ СТРОК ВЛЕВО-ВПРАВО. 0 = выключено.
   Число = сколько пробелов максимум добавить перед строкой (1 пробел = небольшой сдвиг).
   2 = чуть-чуть, 3 = заметно. */
const SHIFT_X = 1;

const log = m => document.getElementById('status').textContent = " " + m;

/* текст берём из ?text=, показываем в поле — можно поправить перед генерацией */
const textarea = document.getElementById('cardtext');
textarea.value = new URLSearchParams(location.search).get('text') || "My Text";

const cb = document.getElementById('autoclose');
cb.checked = localStorage.getItem('autoclose') === '1';
cb.addEventListener('change', () => localStorage.setItem('autoclose', cb.checked ? '1' : '0'));

const sel = document.getElementById('font');
(async () => {
  try{
    const files = await (await fetch(FONTS_API)).json();
    const fonts = files.filter(f => /\.(otf|ttf)$/i.test(f.name));
    sel.innerHTML = "";
    fonts.forEach(f => {
      const o = document.createElement('option');
      o.value = f.name;
      o.textContent = f.name.replace(/\.(otf|ttf)$/i,'');
      sel.appendChild(o);
    });
    const saved = localStorage.getItem('font');
    if (saved && [...sel.options].some(o => o.value === saved)) sel.value = saved;
  }catch(e){
    sel.innerHTML = "<option value=''>не удалось получить список</option>";
  }
})();
sel.addEventListener('change', () => localStorage.setItem('font', sel.value));

/* ---------- случайные варианты букв (только для шрифта Paua) ----------
   В шрифте у каждой буквы 3 варианта. Каждая буква получает случайный вариант,
   и одна и та же буква два раза подряд одинаковой не будет.
   Связки букв (an, ss, st, er...) не трогаем - они и так живые. */
const RANDOM_FONT = /pauapp/i;
const VARIANTS = {"A":[65,57344,57345],"B":[66,57346,57347],"C":[67,57348,57349],"D":[68,57350,57351],"E":[69,57352,57353],"F":[70,57354,57355],"G":[71,57356,57357],"H":[72,57358,57359],"I":[73,57360,57361],"J":[74,57362,57363],"K":[75,57364,57365],"L":[76,57366,57367],"M":[77,57368,57369],"N":[78,57370,57371],"O":[79,57372,57373],"P":[80,57374,57375],"Q":[81,57376,57377],"R":[82,57378,57379],"S":[83,57380,57381],"T":[84,57382,57383],"U":[85,57384,57385],"V":[86,57386,57387],"W":[87,57388,57389],"X":[88,57390,57391],"Y":[89,57392,57393],"Z":[90,57394,57395],"a":[97,57396,57397],"b":[98,57398,57399],"c":[99,57400,57401],":":[58,57402,57403],",":[44,57404,57405],"d":[100,57406,57407],"e":[101,57408,57409],"!":[33,57410,57411],"f":[102,57412,57413],"g":[103,57414,57415],"h":[104,57416,57417],"-":[45,57418,57419],"i":[105,57420,57421],"j":[106,57422,57423],"k":[107,57424,57425],"l":[108,57426,57427],"m":[109,57428,57429],"n":[110,57430,57431],"o":[111,57432,57433],"p":[112,57434,57435],".":[46,57436,57437],"+":[43,57438,57439],"q":[113,57440,57441],"?":[63,57442,57443],"\u201e":[8222,57444,57445],"\u201a":[8218,57446,57447],"r":[114,57448,57449],"s":[115,57450,57451],";":[59,57452,57453],"t":[116,57454,57455],"u":[117,57456,57457],"v":[118,57458,57459],"w":[119,57460,57461],"x":[120,57462,57463],"y":[121,57464,57465],"z":[122,57466,57467]};
const LIGS = ["ing", "an", "th", "oo", "tt", "rr", "st", "ss", "er", "mm", "pp", "dd", "ea", "ed", "he", "cc", "in", "ff", "ou", "nn", "ee", "ll", "re"];
function randomizeLetters(text){
  const last = {};
  let out = "", i = 0;
  while (i < text.length){
    const lig = LIGS.find(l => text.startsWith(l, i));
    if (lig){ out += lig; i += lig.length; continue; }
    const ch = text[i], v = VARIANTS[ch];
    if (v){
      let n;
      do { n = Math.floor(Math.random() * v.length); } while (v.length > 1 && n === last[ch]);
      last[ch] = n;
      out += String.fromCharCode(v[n]);
    } else out += ch;
    i++;
  }
  return out;
}

/* каждой строке случайно добавляем 0..SHIFT_X пробелов в начало -
   строки чуть гуляют влево-вправо, как у живого человека */
function jitterLines(text){
  if (!(SHIFT_X > 0)) return text;
  return text.split("\r").map(line => {
    if (!line.trim()) return line;
    return " ".repeat(Math.floor(Math.random() * (SHIFT_X + 1))) + line;
  }).join("\r");
}

/* проверка: есть ли в шрифте символ U+E000 (значит это новый шрифт с вариантами) */
function fontHasVariants(buf){
  try{
    const d = new DataView(buf), n = d.getUint16(4);
    let cmap = -1;
    for (let i = 0; i < n; i++){
      const r = 12 + i*16;
      if (String.fromCharCode(d.getUint8(r),d.getUint8(r+1),d.getUint8(r+2),d.getUint8(r+3)) === "cmap") cmap = d.getUint32(r+8);
    }
    if (cmap < 0) return false;
    const cnt = d.getUint16(cmap+2);
    for (let i = 0; i < cnt; i++){
      const r = cmap + 4 + i*8, pid = d.getUint16(r), eid = d.getUint16(r+2), off = cmap + d.getUint32(r+4);
      if (!((pid === 3 && eid === 1) || pid === 0) || d.getUint16(off) !== 4) continue;
      const seg = d.getUint16(off+6) / 2;
      for (let k = 0; k < seg; k++){
        const end = d.getUint16(off+14+k*2), start = d.getUint16(off+16+seg*2+k*2);
        if (start <= 0xE000 && 0xE000 <= end) return true;
      }
    }
  }catch(e){}
  return false;
}

/* ---------- мягкие края ----------
   A = картинка с текстом, B = та же картинка без текста.
   Разница (B - A) = только "чернила" со всеми эффектами шаблона.
   Чуть размываем только эту разницу и накладываем обратно на B.
   Фон не трогается, толщина букв визуально не растёт. */
async function decodePng(buf){
  const bmp = await createImageBitmap(new Blob([buf], {type:"image/png"}));
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(bmp, 0, 0);
  return { c, ctx, img: ctx.getImageData(0, 0, c.width, c.height) };
}

function gaussKernel(sigma){
  const r = Math.max(1, Math.ceil(sigma * 3));
  const k = []; let s = 0;
  for (let i = -r; i <= r; i++){ const v = Math.exp(-(i*i)/(2*sigma*sigma)); k.push(v); s += v; }
  return k.map(v => v / s);
}

function softenInk(A, B, w, h, sigma){
  const out = new Uint8ClampedArray(B);
  const k = gaussKernel(sigma), r = (k.length - 1) / 2;

  /* область, где есть текст (чтобы считать быстро) */
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const i = (y*w + x) * 4;
      if (A[i] !== B[i] || A[i+1] !== B[i+1] || A[i+2] !== B[i+2]){
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0) return new Uint8ClampedArray(A);   // текста не нашли — отдаём как есть
  x0 = Math.max(0, x0 - 2*r); y0 = Math.max(0, y0 - 2*r);
  x1 = Math.min(w - 1, x1 + 2*r); y1 = Math.min(h - 1, y1 + 2*r);
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;

  const d = new Float32Array(bw*bh), t = new Float32Array(bw*bh);
  for (let ch = 0; ch < 3; ch++){
    for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++){
      const i = ((y+y0)*w + (x+x0)) * 4 + ch;
      d[y*bw + x] = B[i] - A[i];
    }
    for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++){
      let s = 0;
      for (let j = -r; j <= r; j++){
        let xx = x + j; if (xx < 0) xx = 0; else if (xx >= bw) xx = bw - 1;
        s += d[y*bw + xx] * k[j + r];
      }
      t[y*bw + x] = s;
    }
    for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++){
      let s = 0;
      for (let j = -r; j <= r; j++){
        let yy = y + j; if (yy < 0) yy = 0; else if (yy >= bh) yy = bh - 1;
        s += t[yy*bw + x] * k[j + r];
      }
      const i = ((y+y0)*w + (x+x0)) * 4 + ch;
      out[i] = B[i] - s;
    }
  }
  return out;
}

async function makeFinal(withText, noText){
  if (!(SOFT > 0) || !noText) return new Blob([withText], {type:"image/png"});
  try{
    const a = await decodePng(withText);
    const b = await decodePng(noText);
    if (a.c.width !== b.c.width || a.c.height !== b.c.height) throw 0;
    const px = softenInk(a.img.data, b.img.data, a.c.width, a.c.height, SOFT);
    a.img.data.set(px);
    a.ctx.putImageData(a.img, 0, 0);
    return await new Promise(res => a.c.toBlob(res, "image/png"));
  }catch(e){
    console.warn("Мягкие края не получились, сохраняю как есть", e);
    return new Blob([withText], {type:"image/png"});
  }
}

async function run(psdBuf){
  const fontFile = sel.value;
  const fontName = fontFile.replace(/\.(otf|ttf)$/i,'');
  const fontUrl  = "/fonts/" + encodeURIComponent(fontFile);
  let cardText = textarea.value.replace(/\n/g, "\r");
   // берём то, что реально в поле (с правками)

  document.getElementById('start').style.display = 'none';
  document.getElementById('pea').style.display = 'block';

  const pea = await Photopea.createEmbed(document.getElementById('pea'));
  await pea.loadAsset(psdBuf);
  const fontBuf = await (await fetch(fontUrl + "?v=" + Date.now(), {cache:"no-store"})).arrayBuffer();
  /* варианты букв включаем, только если в шрифте реально есть новые "номера" */
  if (RANDOM_FONT.test(fontFile) && fontHasVariants(fontBuf)) cardText = randomizeLetters(cardText);
  cardText = jitterLines(cardText);
  await pea.loadAsset(fontBuf);

  const script = `
    function findText(ls){
      for (var i=0;i<ls.length;i++){
        var L = ls[i];
        if (L.kind === LayerKind.TEXT) return L;
        if (L.layers){ var r = findText(L.layers); if (r) return r; }
      }
      return null;
    }
    var doc = app.activeDocument;
    var L = findText(doc.layers);
    if (L){
      /* запоминаем, где был центр текста в шаблоне */
      var b0 = L.bounds, cy0 = (+b0[1] + +b0[3]) / 2, cx0 = (+b0[0] + +b0[2]) / 2;
      L.textItem.contents = ${JSON.stringify(cardText)};
      L.textItem.font = ${JSON.stringify(fontName)};
      /* сдвигаем новый текст так, чтобы его центр по высоте остался там же
         (1 строка или 4 - всегда посередине листка) */
      if (${CENTER_V ? "true" : "false"}){
        try{
          var b1 = L.bounds, cy1 = (+b1[1] + +b1[3]) / 2;
          var dy = cy0 - cy1;                       /* ровно по центру */
          var h0 = +b0[3] - +b0[1], h1 = +b1[3] - +b1[1];
          if (h1 < h0) dy -= ${Number(UP) || 0} * (h0 - h1) / 2;   /* короткий текст - чуть выше */
          /* по горизонтали возвращаем блок в центр (сдвигаются только строки относительно друг друга) */
          var dx = ${SHIFT_X > 0 ? "true" : "false"} ? cx0 - (+b1[0] + +b1[2]) / 2 : 0;
          if (Math.abs(dy) > 0.5 || Math.abs(dx) > 0.5) L.translate(dx, dy);
        }catch(e){}
      }
      doc.saveToOE("png");                 /* 1-й снимок: с текстом */
      if (${SOFT > 0 ? "true" : "false"}){
        L.visible = false;
        doc.saveToOE("png");               /* 2-й снимок: без текста */
        L.visible = true;
      }
    } else {
      app.echoToOE("NOTEXTLAYER");
    }
  `;
  const out = await pea.runScript(script);
  if (out.find(x => x === "NOTEXTLAYER")) return;
  const pngs = out.filter(x => x instanceof ArrayBuffer);
  if (!pngs.length) return;

  const blob = await makeFinal(pngs[0], pngs[1]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "card.png"; a.click();
  if (cb.checked) setTimeout(() => window.close(), 2000);
}
if (PSD_URL){
  fetch(PSD_URL).then(r => r.arrayBuffer()).then(run);
} else {
  document.getElementById('psd').addEventListener('change', async e => {
    if (e.target.files[0]) run(await e.target.files[0].arrayBuffer());
  });
}
</script>
