<!DOCTYPE html>
<meta charset="utf-8">
<title>PSD Editor</title>
<style>
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #start{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;gap:40px;
  }
  #pick{
    font-size:28px;font-weight:600;padding:22px 46px;
    background:#1a1a1a;color:#D4A017;border:1.5px solid #D4A017;border-radius:18px;
    cursor:pointer;letter-spacing:.2px;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
    transition:background .15s ease;
  }
  #pick:hover{background:#262626}
  #psd{display:none}

  #secondary{display:flex;flex-direction:column;align-items:center;gap:16px;width:340px}

  #fontrow{display:flex;align-items:center;gap:10px;font-size:14px;color:#8a8a8e}
  #font{
    font-size:14px;color:#6e6e73;background:transparent;
    border:none;border-bottom:1px solid #d2d2d7;
    padding:2px 4px;cursor:pointer;outline:none;
  }
  #font:hover,#font:focus{color:#1d1d1f;border-bottom-color:#1d1d1f}

  #textblock{width:100%;display:flex;flex-direction:column;gap:6px}
  #textblock label{font-size:13px;color:#8a8a8e;text-align:center}
  #cardtext{
    width:100%;box-sizing:border-box;
    font-size:14px;color:#1d1d1f;font-family:inherit;
    border:1px solid #d2d2d7;border-radius:10px;
    padding:10px 12px;resize:vertical;min-height:80px;
    outline:none;text-align:center;
  }
  #cardtext:focus{border-color:#1d1d1f}

  #bar{display:flex;align-items:center;gap:6px;font-size:13px;color:#8a8a8e}
  #bar input[type=checkbox]{width:14px;height:14px;accent-color:#1d1d1f;cursor:pointer}
  #status{margin-left:8px;color:#8a8a8e;font-size:13px}

  #pea{width:100vw;height:100vh;display:none}
</style>

<div id="start">
  <label id="pick" for="psd">📂 Выбрать PSD-шаблон</label>
  <input type="file" id="psd" accept=".psd">
  <div id="secondary">
    <div id="fontrow">
      <span>Шрифт</span>
      <select id="font"><option>загружаю список...</option></select>
    </div>
    <div id="textblock">
      <label for="cardtext">Текст на карточке</label>
      <textarea id="cardtext" rows="4"></textarea>
    </div>
    <div id="bar">
      <label style="display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="autoclose"> закрывать вкладку после сохранения
      </label>
      <span id="status"></span>
    </div>
  </div>
</div>
<div id="pea"></div>

<script src="https://cdn.jsdelivr.net/npm/photopea@1.0.2/dist/photopea.min.js"></script>
<script>
const FONTS_API = "https://api.github.com/repos/pablitocrypto/photopi/contents/fonts";
const PSD_URL   = "";

/* Размытие краёв букв в пикселях. 0 = выключено.
   Больше = мягче. Для фото 2048 px обычно 0.6-1.0 */
const BLUR = 0.8;

const log = m => document.getElementById('status').textContent = " " + m;

/* текст берём из ?text=, показываем в поле — можно поправить перед генерацией */
const textarea = document.getElementById('cardtext');
textarea.value = new URLSearchParams(location.search).get('text') || "My Text";

const cb = document.getElementById('autoclose');
cb.checked = localStorage.getItem('autoclose') === '1';
cb.addEventListener('change', () => localStorage.setItem('autoclose', cb.checked ? '1' : '0'));

const sel = document.getElementById('font');
(async () => {
  try{
    const files = await (await fetch(FONTS_API)).json();
    const fonts = files.filter(f => /\.(otf|ttf)$/i.test(f.name));
    sel.innerHTML = "";
    fonts.forEach(f => {
      const o = document.createElement('option');
      o.value = f.name;
      o.textContent = f.name.replace(/\.(otf|ttf)$/i,'');
      sel.appendChild(o);
    });
    const saved = localStorage.getItem('font');
    if (saved && [...sel.options].some(o => o.value === saved)) sel.value = saved;
  }catch(e){
    sel.innerHTML = "<option value=''>не удалось получить список</option>";
  }
})();
sel.addEventListener('change', () => localStorage.setItem('font', sel.value));

async function run(psdBuf){
  const fontFile = sel.value;
  const fontName = fontFile.replace(/\.(otf|ttf)$/i,'');
  const fontUrl  = "/fonts/" + encodeURIComponent(fontFile);
  const cardText = textarea.value.replace(/\n/g, "\r");   // берём то, что реально в поле (с правками)

  document.getElementById('start').style.display = 'none';
  document.getElementById('pea').style.display = 'block';

  const pea = await Photopea.createEmbed(document.getElementById('pea'));
  await pea.loadAsset(psdBuf);
  await pea.loadAsset(await (await fetch(fontUrl)).arrayBuffer());

  const script = `
    function findText(ls){
      for (var i=0;i<ls.length;i++){
        var L = ls[i];
        if (L.kind === LayerKind.TEXT) return L;
        if (L.layers){ var r = findText(L.layers); if (r) return r; }
      }
      return null;
    }
    var doc = app.activeDocument;
    var L = findText(doc.layers);
    if (L){
      L.textItem.contents = ${JSON.stringify(cardText)};
      L.textItem.font = ${JSON.stringify(fontName)};

      /* мягкие края: превращаем текст в картинку и чуть размываем.
         Стили слоя, режим, шум и градиент сверху сохраняются.
         Если что-то не сработает - просто сохранится без размытия. */
      var blur = ${Number(BLUR) || 0};
      if (blur > 0){
        try{
          doc.activeLayer = L;
          L.rasterize(RasterizeType.TEXTCONTENTS);
          L.applyGaussianBlur(blur);
          app.echoToOE("BLUR_OK");
        }catch(e){
          app.echoToOE("BLUR_FAIL");
        }
      }

      doc.saveToOE("png");
    } else {
      app.echoToOE("NOTEXTLAYER");
    }
  `;
  const out = await pea.runScript(script);
  if (out.find(x => x === "NOTEXTLAYER")) return;
  if (out.find(x => x === "BLUR_FAIL")) console.warn("Размытие не применилось, сохранено без него");
  const png = out.find(x => x instanceof ArrayBuffer);
  if (png){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([png], {type:"image/png"}));
    a.download = "card.png"; a.click();
    if (cb.checked) setTimeout(() => window.close(), 2000);
  }
}
if (PSD_URL){
  fetch(PSD_URL).then(r => r.arrayBuffer()).then(run);
} else {
  document.getElementById('psd').addEventListener('change', async e => {
    if (e.target.files[0]) run(await e.target.files[0].arrayBuffer());
  });
}
</script>
